name: CI

# 품질 게이트: PR과 dev/main push마다 lint + build 검증.
# 배포(CD)는 Vercel이 담당하므로 여기서는 하지 않는다.
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# 같은 ref에서 새 커밋이 오면 진행 중인 CI는 취소 (배포가 아니므로 안전)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # close-linked-issues 워크플로는 이슈를 닫는 쓰기 권한을 든 자동화다.
      # 그 정규식과 오류 처리를 여기서 검사한다 (#243).
      #
      # 이 단계를 먼저 두는 이유: npm ci 는 2~3분이 걸리고 이 검사는 몇 초다.
      # 워크플로가 깨졌으면 빨리 안다.
      #
      # gh 를 가짜로 세우므로 진짜 이슈는 닫히지 않는다. 의존성은 bash·awk·grep 뿐이다.
      - name: Test close-linked-issues workflow
        run: bash scripts/test-close-linked-issues.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # check-upgrade-blockers 워크플로의 보고 판단을 검사한다 (#253).
      # 그 워크플로는 주 1회만 돌므로 로직이 깨져도 몇 주 뒤에나 드러난다 —
      # 실제로 node -p 의 ANSI 색 때문에 영영 침묵하는 결함이 여기서 잡혔다.
      #
      # 판별기 본체는 후보 버전을 실제로 설치하므로 몇 분이 걸린다. 여기서는 돌리지
      # 않고 문법과 보고 판단만 본다 — npm ci 없이 몇 초에 끝난다.
      - name: Test upgrade-blocker reporting
        run: bash scripts/test-check-upgrade-blockers.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 코드 블록 토큰색이 지면 대비 AA 를 넘는지, 테마를 정본으로 검사한다 (#246).
      # 렌더된 글을 훑어 세면 그 표본에 없는 스코프를 놓친다 — #224 가 그렇게 3개만
      # 고쳤고 승격 뒤 프로덕션에서 네 번째가 잡혔다.
      #
      # shiki 를 import 하므로 npm ci 뒤에 둔다.
      - name: Test code block contrast
        run: node scripts/test-shiki-contrast.mjs

      # 이력서는 Notion 한 칸에 JSON 통째로 들어간다 — 한 번 잘못 쓰면 전부 잃는 구조라
      # 폴백이 유일한 안전망이다. 그런데 폴백은 평소에 돌지 않는 길이라, 확인하지 않으면
      # 정작 필요한 순간에 동작하지 않는다 (#262 2단계).
      #
      # tsc 를 쓰므로 npm ci 뒤에 둔다.
      - name: Test resume Notion fallback
        run: bash scripts/test-resume-fallback.sh
